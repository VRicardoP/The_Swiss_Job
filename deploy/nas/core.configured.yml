# Topología REAL de producción en el NAS — core.configured.yml
# Copia semántica de /share/CACHEDEV1_DATA/Public/unification-e15-20260914/core.configured.yml,
# con 8 valores sensibles sustituidos por marcadores.
# Refrescado el 2026-10-20 tras desplegar DT-148 (sección A + F1/F2) en 8ffb8b3:
# filtros `category`/`since` del catálogo y kill-switch de bloqueos parciales.
name: unification-e15-20260914
services:
  core-api:
    restart: unless-stopped
    container_name: swissjob-core-api-r5
    command:
    - uvicorn
    - jobhunt_core.api.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      CORE_BROKER_URL: ${CORE_BROKER_URL}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      CORE_ENV: prod
      CORE_JSEARCH_RAPIDAPI_KEY: ${CORE_JSEARCH_RAPIDAPI_KEY}
      CORE_RESULT_BACKEND: ${CORE_RESULT_BACKEND}
      CORE_SAVED_SEARCH_EXECUTION_ENABLED: 'true'
      GPG_KEY: ${GPG_KEY}
      LANG: C.UTF-8
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHON_VERSION: 3.12.14
      PYTHONDONTWRITEBYTECODE: '1'
    image: swissjob-core:point5-500d8d9
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    mem_limit: '536870912'
    networks:
      swissjob-r5_core-net:
        aliases:
        - swissjob-core-api-r5
        - core-api
      swissjob_swissjob-net:
        aliases:
        - swissjob-core-api-r5
        - core-api
    shm_size: '67108864'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    user: core
    working_dir: /app
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready',
        timeout=5)
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 30s
  core-harvest-worker:
    restart: unless-stopped
    container_name: swissjob-core-harvest-worker-r5
    command:
    - celery
    - -A
    - jobhunt_core.celery_app
    - worker
    - -l
    - info
    - -Q
    - core.harvest
    - --concurrency=1
    environment:
      CORE_ADZUNA_APP_ID: ${CORE_ADZUNA_APP_ID}
      CORE_ADZUNA_APP_KEY: ${CORE_ADZUNA_APP_KEY}
      CORE_BROKER_URL: ${CORE_BROKER_URL}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      CORE_DELIVERY_HTTP_DESTINATIONS: '{"portfolio": "http://portfolio_backend:8000/api/v1/integration/inbox",
        "swissjob-shadow": "http://swissjob-backend:8000/api/v1/integration/events"}'
      CORE_DELIVERY_HTTP_TOKEN: ${CORE_DELIVERY_HTTP_TOKEN}
      CORE_ENV: prod
      CORE_JSEARCH_RAPIDAPI_KEY: ${CORE_JSEARCH_RAPIDAPI_KEY}
      CORE_RESULT_BACKEND: ${CORE_RESULT_BACKEND}
      CORE_SAVED_SEARCH_EXECUTION_ENABLED: 'true'
      GPG_KEY: ${GPG_KEY}
      LANG: C.UTF-8
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHON_VERSION: 3.12.14
      PYTHONDONTWRITEBYTECODE: '1'
    image: swissjob-core:point5-500d8d9
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    mem_limit: '805306368'
    networks:
      swissjob-r5_core-net:
        aliases:
        - swissjob-core-harvest-worker-r5
        - core-harvest-worker
      swissjob_swissjob-net:
        aliases:
        - swissjob-core-harvest-worker-r5
        - core-harvest-worker
    shm_size: '67108864'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    user: core
    working_dir: /app
  core-ops-worker:
    restart: unless-stopped
    container_name: swissjob-core-ops-worker-r5
    command:
    - celery
    - -A
    - jobhunt_core.celery_app
    - worker
    - -l
    - info
    - -Q
    - core.default,core.notifications
    - --concurrency=1
    - -B
    - -s
    - /tmp/celerybeat-schedule
    environment:
      CORE_BROKER_URL: ${CORE_BROKER_URL}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      CORE_DELIVERY_HTTP_DESTINATIONS: '{"portfolio": "http://portfolio_backend:8000/api/v1/integration/inbox",
        "swissjob-shadow": "http://swissjob-backend:8000/api/v1/integration/events"}'
      CORE_DELIVERY_HTTP_TOKEN: ${CORE_DELIVERY_HTTP_TOKEN}
      CORE_ENV: prod
      CORE_RESULT_BACKEND: ${CORE_RESULT_BACKEND}
      CORE_SAVED_SEARCH_EXECUTION_ENABLED: 'true'
      GPG_KEY: ${GPG_KEY}
      LANG: C.UTF-8
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHON_VERSION: 3.12.14
      PYTHONDONTWRITEBYTECODE: '1'
    image: swissjob-core:point5-500d8d9
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    mem_limit: '805306368'
    networks:
      swissjob-r5_core-net:
        aliases:
        - swissjob-core-ops-worker-r5
        - core-ops-worker
      swissjob_swissjob-net:
        aliases:
        - swissjob-core-ops-worker-r5
        - core-ops-worker
    shm_size: '67108864'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    user: core
    working_dir: /app
  core-worker:
    restart: unless-stopped
    container_name: swissjob-core-worker-r5
    command:
    - celery
    - -A
    - jobhunt_core.celery_app
    - worker
    - -l
    - info
    - -Q
    - core.embedding,core.matching
    - --concurrency=1
    environment:
      CORE_BROKER_URL: ${CORE_BROKER_URL}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      CORE_DELIVERY_HTTP_DESTINATIONS: '{"portfolio": "http://portfolio_backend:8000/api/v1/integration/inbox",
        "swissjob-shadow": "http://swissjob-backend:8000/api/v1/integration/events"}'
      CORE_DELIVERY_HTTP_TOKEN: ${CORE_DELIVERY_HTTP_TOKEN}
      CORE_ENV: prod
      CORE_RESULT_BACKEND: ${CORE_RESULT_BACKEND}
      CORE_SAVED_SEARCH_EXECUTION_ENABLED: 'true'
      GPG_KEY: ${GPG_KEY}
      LANG: C.UTF-8
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHON_VERSION: 3.12.14
      PYTHONDONTWRITEBYTECODE: '1'
    image: swissjob-core:point5-500d8d9
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    mem_limit: '2147483648'
    networks:
      swissjob-r5_core-net:
        aliases:
        - swissjob-core-worker-r5
        - core-worker
      swissjob_swissjob-net:
        aliases:
        - swissjob-core-worker-r5
        - core-worker
    shm_size: '67108864'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    user: core
    volumes:
    - type: volume
      source: swissjob-r5_core-hf-cache
      target: /tmp/hf-cache
    working_dir: /app
networks:
  swissjob-r5_core-net:
    name: swissjob-r5_core-net
    external: true
  swissjob_swissjob-net:
    name: swissjob_swissjob-net
    external: true
volumes:
  swissjob-r5_core-hf-cache:
    name: swissjob-r5_core-hf-cache
    external: true
