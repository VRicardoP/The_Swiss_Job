# Topología REAL de producción en el NAS — core.configured.yml
# T13 §7 / A19-04. Copia literal de /share/CACHEDEV1_DATA/Public/unification-e15-20260914/core.configured.yml,
# con los valores sensibles sustituidos por ${VARIABLE} (6). Verificado sin secretos por
# scripts/check_no_secrets.py (también en CI). Refrescado el 2026-09-28 tras aplicar
# healthchecks a 60 s y límites de memoria (A19-25, A19-11).
services:
  core-api:
    image: swissjob-core:point5-fed376a
    mem_limit: 512m
    container_name: swissjob-core-api-r5
    environment:
      CORE_SHADOW_RUN_CYCLE_MINUTE: '35'
      CORE_SHADOW_RUN_CYCLE_HOUR: '11'
      CORE_SHADOW_CYCLE_START_HOUR: '11'
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      CORE_CAPTURE_SLOT: jobhunt_shadow_r5_rehearsal
      CORE_ENV: prod
      CORE_BROKER_URL: ${CORE_BROKER_URL}
      CORE_SHADOW_PRE_GATE_EVERY_S: '1800'
      CORE_RESULT_BACKEND: ${CORE_RESULT_BACKEND}
      CORE_SHADOW_CYCLE_START_MINUTE: '30'
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: C.UTF-8
      GPG_KEY: ${GPG_KEY}
      PYTHON_VERSION: 3.12.14
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HOME: /tmp/hf-cache
      CORE_SAVED_SEARCH_EXECUTION_ENABLED: 'true'
    restart: unless-stopped
    entrypoint: null
    command:
    - uvicorn
    - jobhunt_core.api.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    working_dir: /app
    user: core
    networks:
      swissjob-r5_core-net:
        aliases:
        - swissjob-core-api-r5
        - core-api
      swissjob_swissjob-net:
        aliases:
        - swissjob-core-api-r5
        - core-api
    volumes: []
    shm_size: 67108864
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready',
        timeout=5)
      interval: 30000000000ns
      timeout: 10000000000ns
      start_period: 30000000000ns
      retries: 3
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
  core-worker:
    image: swissjob-core:point5-fed376a
    mem_limit: 2g
    container_name: swissjob-core-worker-r5
    environment:
      CORE_DELIVERY_HTTP_DESTINATIONS: '{"portfolio": "http://portfolio_backend:8000/api/v1/integration/inbox",
        "swissjob-shadow": "http://swissjob-backend:8000/api/v1/integration/events"}'
      CORE_SHADOW_RUN_CYCLE_HOUR: '11'
      CORE_ENV: prod
      CORE_SHADOW_CYCLE_START_MINUTE: '30'
      CORE_SHADOW_CYCLE_START_HOUR: '11'
      CORE_RESULT_BACKEND: ${CORE_RESULT_BACKEND}
      CORE_DELIVERY_HTTP_TOKEN: ${CORE_DELIVERY_HTTP_TOKEN}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      CORE_SHADOW_PRE_GATE_EVERY_S: '1800'
      CORE_BROKER_URL: ${CORE_BROKER_URL}
      CORE_SHADOW_RUN_CYCLE_MINUTE: '35'
      CORE_CAPTURE_SLOT: jobhunt_shadow_r5_rehearsal
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: C.UTF-8
      GPG_KEY: ${GPG_KEY}
      PYTHON_VERSION: 3.12.14
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HOME: /tmp/hf-cache
      CORE_SAVED_SEARCH_EXECUTION_ENABLED: 'true'
    restart: unless-stopped
    entrypoint: null
    command:
    - celery
    - -A
    - jobhunt_core.celery_app
    - worker
    - -l
    - info
    - -Q
    - core.default,core.harvest,core.embedding,core.matching,core.notifications
    - --concurrency=2
    - -B
    - -s
    - /tmp/celerybeat-schedule
    working_dir: /app
    user: core
    networks:
      swissjob-r5_core-net:
        aliases:
        - swissjob-core-worker-r5
        - core-worker
      swissjob_swissjob-net:
        aliases:
        - swissjob-core-worker-r5
        - core-worker
    volumes:
    - type: volume
      source: swissjob-r5_core-hf-cache
      target: /tmp/hf-cache
      read_only: false
    shm_size: 67108864
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
  core-capture:
    image: swissjob-core:point5-9d6b46e
    mem_limit: 256m
    container_name: swissjob-core-capture-r5
    environment:
      CORE_CAPTURE_SLOT: jobhunt_shadow_r5_rehearsal
      CORE_SHADOW_RUN_CYCLE_HOUR: '11'
      CORE_BROKER_URL: ${CORE_BROKER_URL}
      CORE_SHADOW_RUN_CYCLE_MINUTE: '35'
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      CORE_SHADOW_CYCLE_START_HOUR: '11'
      CORE_ENV: prod
      CORE_SHADOW_PRE_GATE_EVERY_S: '1800'
      CORE_RESULT_BACKEND: ${CORE_RESULT_BACKEND}
      CAPTURE_DSN: ${CAPTURE_DSN}
      CORE_SHADOW_CYCLE_START_MINUTE: '30'
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: C.UTF-8
      GPG_KEY: ${GPG_KEY}
      PYTHON_VERSION: 3.12.14
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HOME: /tmp/hf-cache
    restart: unless-stopped
    entrypoint: null
    command:
    - python
    - -m
    - jobhunt_core.shadow.capture
    working_dir: /app
    user: core
    networks:
      swissjob_swissjob-net:
        aliases:
        - swissjob-core-capture-r5
        - core-capture
    volumes: []
    shm_size: 67108864
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - jobhunt_core.shadow.capture
      - --health
      interval: 120000000000ns
      timeout: 60000000000ns
      start_period: 600000000000ns
      retries: 3
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
networks:
  swissjob-r5_core-net:
    external: true
    name: swissjob-r5_core-net
  swissjob_swissjob-net:
    external: true
    name: swissjob_swissjob-net
volumes:
  swissjob-r5_core-hf-cache:
    external: true
    name: swissjob-r5_core-hf-cache
