      test:
      - CMD-SHELL
      - wget -q -O- http://127.0.0.1/nginx-health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  swissjob_swissjob-net:
    external: true
    name: swissjob_swissjob-net
