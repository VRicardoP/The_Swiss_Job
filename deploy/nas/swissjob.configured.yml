# Topología REAL de producción en el NAS — swissjob.configured.yml
# T13 §7 / A19-04. Copia literal de /share/CACHEDEV1_DATA/Public/unification-e15-20260914/swissjob.configured.yml,
# con los valores sensibles sustituidos por ${VARIABLE} (19). Verificado sin secretos por
# scripts/check_no_secrets.py (también en CI). Refrescado el 2026-09-28 tras aplicar
# healthchecks a 60 s y límites de memoria (A19-25, A19-11).
# Refrescado el 2026-10-20 tras desplegar DT-148 en 8ffb8b3 (aviso de profesor
# leyendo el núcleo, purga de refresh, dos verticales retirados y la migración
# a7c3d9e2f5b1). La etiqueta del frontend se corrige de paso: el versionado
# decía 254e826 y lo que corre desde hace semanas es acf48b2.
services:
  backend:
    image: swissjob-backend:point5-500d8d9
    mem_limit: 1536m
    container_name: swissjob-backend
    environment:
      REDIS_URL: ${REDIS_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_USER: ${SMTP_USER}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORE_API_BASE_URL: ${CORE_API_BASE_URL}
      SMTP_PORT: '587'
      CORE_HTTP_TIMEOUT_SECONDS: '120'
      CORE_INBOX_TOKEN: ${CORE_INBOX_TOKEN}
      CORE_ERASURE_REPLICA_ID: swissjob-live
      # DT-148 (2026-10-21): el compose VIVO llevaba aquí dos variables de entorno
      # residuales —la ruta de navegadores del scraping retirado y el interruptor
      # de la cosecha diaria legacy— que esta copia no recogía. Se RETIRARON del
      # NAS (autorizado por el propietario) y backend y worker se recrearon sin
      # ellas: comprobado con `env` dentro de los dos contenedores. Ninguna tenía
      # lector en el repo, el directorio de navegadores no existe en la imagen y
      # la librería tampoco está instalada.
      #
      # Sus nombres NO se escriben aquí a propósito: `check_source_ownership.py`
      # los trata como marcadores del runtime retirado y busca el literal en TODO
      # el fichero, comentarios incluidos. Nombrarlos para explicar que se fueron
      # pondría el guard en rojo — y el guard tiene razón: este fichero es de
      # runtime de producción y ahí esos nombres no deben volver a aparecer.
      SECRET_KEY: ${SECRET_KEY}
      SMTP_HOST: smtp.gmail.com
      SCHEDULER_ENABLED: 'True'
      BACKEND_CORS_ORIGINS: '["http://capsule.tailebc81d.ts.net:4000"]'
      POSTGRES_DB: swissjobhunter
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SMTP_FROM: ${SMTP_FROM}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      TEACHER_ALERT_EMAIL: ${TEACHER_ALERT_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      POSTGRES_USER: swissjob
      CORE_CONSUMER_KEY: ${CORE_CONSUMER_KEY}
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: C.UTF-8
      GPG_KEY: ${GPG_KEY}
      PYTHON_VERSION: 3.12.14
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SCHOOL_WRITES_FROZEN: 'false'
      CORE_PROFILE_SYNC_ENABLED: 'true'
      CORE_FEEDBACK_ENABLED: 'true'
      CORE_MATCH_FACETS_ENABLED: 'true'
      FEEDBACK_WRITES_FROZEN: 'false'
    restart: unless-stopped
    entrypoint:
    - ./scripts/entrypoint.sh
    command:
    - gunicorn
    - main:app
    - -w
    - '2'
    - -k
    - uvicorn.workers.UvicornWorker
    - --bind
    - 0.0.0.0:8000
    - --access-logfile
    - '-'
    - --error-logfile
    - '-'
    - --timeout
    - '420'
    working_dir: /app
    user: app
    networks:
      swissjob_swissjob-net:
        aliases:
        - swissjob-backend
        - backend
    shm_size: 67108864
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8000/health || exit 1
      interval: 30000000000ns
      timeout: 5000000000ns
      start_period: 360000000000ns
      retries: 5
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
  worker:
    image: swissjob-backend:point5-500d8d9
    mem_limit: 1g
    container_name: swissjob-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_CORS_ORIGINS: '["http://capsule.tailebc81d.ts.net:4000"]'
      GROQ_API_KEY: ${GROQ_API_KEY}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      SMTP_USER: ${SMTP_USER}
      POSTGRES_USER: swissjob
      SMTP_HOST: smtp.gmail.com
      # DT-148 (2026-10-21): el compose VIVO llevaba aquí dos variables de entorno
      # residuales —la ruta de navegadores del scraping retirado y el interruptor
      # de la cosecha diaria legacy— que esta copia no recogía. Se RETIRARON del
      # NAS (autorizado por el propietario) y backend y worker se recrearon sin
      # ellas: comprobado con `env` dentro de los dos contenedores. Ninguna tenía
      # lector en el repo, el directorio de navegadores no existe en la imagen y
      # la librería tampoco está instalada.
      #
      # Sus nombres NO se escriben aquí a propósito: `check_source_ownership.py`
      # los trata como marcadores del runtime retirado y busca el literal en TODO
      # el fichero, comentarios incluidos. Nombrarlos para explicar que se fueron
      # pondría el guard en rojo — y el guard tiene razón: este fichero es de
      # runtime de producción y ahí esos nombres no deben volver a aparecer.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_PORT: '587'
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      SMTP_FROM: ${SMTP_FROM}
      TEACHER_ALERT_EMAIL: ${TEACHER_ALERT_EMAIL}
      POSTGRES_DB: swissjobhunter
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SCHEDULER_ENABLED: 'True'
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: C.UTF-8
      GPG_KEY: ${GPG_KEY}
      PYTHON_VERSION: 3.12.14
      PYTHON_SHA256: 5c8462af5790baf43a321a1559dbe0db06d1be4300fb85fb53c40060668e548a
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CORE_CONSUMER_KEY: ${CORE_CONSUMER_KEY}
      CORE_API_BASE_URL: ${CORE_API_BASE_URL}
      CORE_HTTP_TIMEOUT_SECONDS: '120'
      SCHOOL_WRITES_FROZEN: 'false'
    restart: unless-stopped
    entrypoint: []
    command:
    - celery
    - -A
    - celery_app
    - worker
    - -Q
    - default,ai
    - --concurrency=2
    - --loglevel=info
    working_dir: /app
    user: app
    networks:
      swissjob_swissjob-net:
        aliases:
        - swissjob-worker
        - worker
    shm_size: 67108864
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 10m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
  frontend:
    image: swissjob-frontend:point5-500d8d9
    mem_limit: 128m
    container_name: swissjob-frontend
    environment:
      SWISSJOB_BACKEND_HOST: ${SWISSJOB_BACKEND_HOST:-swissjob-backend}
    ports:
    - target: 80
      published: '4000'
      protocol: tcp
      mode: ingress
    restart: unless-stopped
    networks:
      swissjob_swissjob-net:
        aliases:
        - swissjob-frontend
        - frontend
