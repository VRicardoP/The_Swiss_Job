# Topología REAL de producción en el NAS — containerstation-swissjob.yml
# T13 §7 / A19-04. Copia literal de /share/CACHEDEV1_DATA/.qpkg/container-station/data/application/swissjob/docker-compose.yml
# (proyecto `swissjob` de Container Station: SOLO postgres y redis), con los valores
# sensibles sustituidos por ${VARIABLE}. Verificado sin secretos por
# scripts/check_no_secrets.py (también en CI), que desde el 2026-11-25 ve también
# los literales en elementos de lista (`--requirepass`).
# Refrescado el 2026-11-25: datos en el SSD (create_host_path: false), directorio de
# despliegue en /share/external/DEV3301_1/apps-ssd/swissjob-deploy y retiradas las
# definiciones muertas de backend, worker y frontend (se despliegan desde
# swissjob.configured.yml). Sin ellas, un `up` sin servicio ya no puede devolverlos
# a imágenes `:prod` viejas.
services:
  postgres:
    image: swissjob-postgres-core:pg16
    container_name: swissjob-postgres
    restart: unless-stopped
    env_file:
    - /share/external/DEV3301_1/apps-ssd/swissjob-deploy/.env.postgres.runtime
    volumes:
    - type: bind
      source: /share/external/DEV3301_1/pgdata-swissjob
      target: /var/lib/postgresql/data
      bind:
        create_host_path: false
    - type: bind
      source: /share/external/DEV3301_1/apps-ssd/swissjob-deploy/docker/postgres/init-pgvector.sql
      target: /docker-entrypoint-initdb.d/init-pgvector.sql
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - swissjob
      - -d
      - swissjobhunter
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
    - swissjob-net
    init: true
    environment:
      CORE_API_BASE_URL: ${CORE_API_BASE_URL}
      CORE_CONSUMER_KEY: ${CORE_CONSUMER_KEY}
      CORE_HTTP_TIMEOUT_SECONDS: null
  redis:
    image: redis:7-alpine
    container_name: swissjob-redis
    restart: unless-stopped
    command:
    - redis-server
    - --save
    - '60'
    - '1'
    - --maxmemory
    - 200mb
    - --maxmemory-policy
    - noeviction
    - --requirepass
    - ${REDIS_PASSWORD}
    volumes:
    - type: bind
      source: /share/external/DEV3301_1/apps-ssd/redis-legacy
      target: /data
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
    - swissjob-net
networks:
  swissjob-net:
    driver: bridge
