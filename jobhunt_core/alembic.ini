# Alembic INDEPENDIENTE del core (A-01). La URL la aporta env.py desde
# CoreSettings (no se duplica aquí); la version table vive en el esquema del
# core (jobhunt.alembic_version), separada de la del legacy (public).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
