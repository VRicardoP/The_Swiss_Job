# SwissJobHunter — stack de producción con BUILD en el NAS.
#
# ⚠ Para QNAP Container Station prefiere docker-compose.qnap.yml (este YAML
#   asume `docker compose` CLI con expansión de ${VARS} y paths relativos,
#   que Container Station NO soporta).
#
# Variantes:
#   - docker-compose.yml          : Dev local.
#   - docker-compose.prod.yml     : Build-en-NAS — este archivo.
#   - docker-compose.prebuilt.yml : Imágenes pre-cargadas via `docker load`.
#   - docker-compose.qnap.yml     : Recomendado para Container Station.
#
# Características:
#   - Único puerto expuesto al host: 8080 (frontend / nginx).
#   - Backend, postgres y redis: solo accesibles vía red interna `swissjob-net`.
#   - Migraciones Alembic se aplican automáticamente en el arranque del backend
#     (scripts/entrypoint.sh). El worker NO migra (entrypoint=[]).
#   - Acceso vía Tailscale: http://capsule.tailebc81d.ts.net:8080
#
# Antes de levantar:
#   1. Generar SECRET_KEY: python -c "import secrets; print(secrets.token_urlsafe(48))"
#   2. Crear .env.prod a partir de .env.prod.example y rellenar los CHANGE_ME.
#      ⚠ POSTGRES_PASSWORD y la parte :password@ de DATABASE_URL deben coincidir.
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# Stop / restart:
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml up -d
# Los volúmenes pgdata, redisdata y hfcache persisten entre restarts.

services:
  postgres:
    # B-01 (sombra en PRODUCCIÓN — autorización del propietario 2026-07-28):
    # imagen custom pgvector+wal2json (docker/postgres-core/) y
    # wal_level=logical vía command. wal_level NO es recargable: aplicar este
    # cambio exige REINICIO del Postgres COMPARTIDO con el legacy (ventana de
    # mantenimiento — ver jobhunt_core/shadow/DEPLOY_NAS.md).
    build:
      context: ./docker/postgres-core
    image: swissjob-postgres-core:pg16
    container_name: swissjob-postgres
    restart: unless-stopped
    command: -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    # env_file en lugar de ${VARS}: misma fuente de credenciales que el
    # backend (imposible que se desincronicen) y compatible con Container
    # Station, que no expande ${VARS} del compose.
    env_file:
      - .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      # $$ escapa la sustitución de compose; el shell del contenedor resuelve
      # $POSTGRES_USER / $POSTGRES_DB con su propio entorno (cargado vía env_file).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swissjob-net

  redis:
    image: redis:7-alpine
    container_name: swissjob-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swissjob-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        # La API no ejecuta scrapers Playwright (los corre el worker), así que su
        # imagen se construye sin Chromium (~1 GB menos).
        INSTALL_BROWSERS: "false"
    image: swissjob-backend:prod
    container_name: swissjob-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Cache de HuggingFace persistente — evita re-descargar el modelo
      # paraphrase-multilingual-MiniLM-L12-v2 (~120 MB) en cada recreate.
      - hfcache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      # start_period generoso: el primer arranque carga el modelo embedding
      # (~120 MB) en CPU del NAS, hasta 5 min. Después del primer arranque
      # el modelo queda en hfcache y los siguientes recreates son <60s.
      start_period: 360s
      retries: 5
    networks:
      - swissjob-net

  worker:
    # Imagen propia CON Chromium: el worker ejecuta los scrapers Playwright.
    # Comparte la capa de pip con swissjob-backend:prod (BuildKit la cachea);
    # solo añade la capa del navegador.
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        INSTALL_BROWSERS: "true"
    image: swissjob-worker:prod
    container_name: swissjob-worker
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      backend:
        condition: service_healthy  # espera a que el backend haya migrado
    # Ya NO monta hfcache: el worker general no escucha "ai" → no carga el modelo (PF.4).
    # NO ejecuta entrypoint.sh (no migra). Arranca celery directamente.
    entrypoint: []
    command:
      - celery
      - -A
      - celery_app
      - worker
      - -Q
      - default,scraping
      - --concurrency=2
      - --loglevel=info
    networks:
      - swissjob-net

  worker-ai:
    # Worker DEDICADO a la cola "ai": carga el modelo de embeddings UNA sola vez
    # (concurrency=1). El worker general ya no escucha "ai", así que no lo carga.
    # Resultado: 1 sola copia del modelo (~400MB) en vez de hasta 3 (PF.4).
    image: swissjob-worker:prod
    container_name: swissjob-worker-ai
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      backend:
        condition: service_healthy  # espera a que el backend haya migrado
    volumes:
      - hfcache:/home/app/.cache/huggingface
    environment:
      # Sin reciclado del hijo prefork → NO recarga el modelo de embeddings (rev.3 #2).
      - CELERY_MAX_TASKS_PER_CHILD=0
    # No ejecuta entrypoint.sh (no migra). Arranca celery directamente.
    entrypoint: []
    command:
      - celery
      - -A
      - celery_app
      - worker
      - -Q
      - ai
      - --concurrency=1
      - --loglevel=info
    networks:
      - swissjob-net

  # ---- jobhunt-core — SOMBRA EN PRODUCCIÓN (Fase B, autorización del
  # propietario 2026-07-28; contrato §0 "cero efectos visibles a usuarios"
  # SIGUE VIGENTE — el outbox solo entrega al inbox sombra).
  # SIN `profiles:`: la sombra ya es producción y debe arrancar con `up -d`
  # a secas (un profile la dejaría parada en silencio).
  # AISLAMIENTO de secretos (revisión A-01 #1): los servicios core NO reciben
  # el .env.prod legacy. Runtime → .env.core.prod; credencial admin
  # (+ CORE_CAPTURE_PASSWORD, B-01) → SOLO core-migrate vía .env.core.admin.prod;
  # DSN de REPLICACIÓN (CAPTURE_DSN) → SOLO core-capture vía
  # .env.core.capture.prod (plantillas .example en el repo).

  redis-core:
    image: redis:7-alpine
    container_name: swissjob-redis-core
    restart: unless-stopped
    # noeviction (un broker jamás expulsa mensajes/locks, ADR-08) + AOF
    # (persistencia) + auth + red core-net exclusiva (el legacy no lo alcanza).
    # SOLO recibe su propio secreto (rev. #2): nunca URLs de BD/Celery.
    env_file:
      - .env.core.redis.prod
    command:
      - sh
      - -c
      - >-
        redis-server --maxmemory 256mb --maxmemory-policy noeviction
        --appendonly yes --appendfsync everysec
        --requirepass "$$CORE_REDIS_PASSWORD"
    volumes:
      - redis_core_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CORE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - core-net

  core-migrate:
    build:
      context: .
      dockerfile: jobhunt_core/Dockerfile
    image: swissjob-core:prod
    container_name: swissjob-core-migrate
    command: python -m jobhunt_core.migrate
    env_file:
      - .env.core.prod
      - .env.core.admin.prod
    environment:
      # Fail-fast: el core NO arranca en prod con credenciales de dev.
      - CORE_ENV=prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - swissjob-net
      - core-net

  core-api:
    image: swissjob-core:prod
    container_name: swissjob-core-api
    restart: unless-stopped
    command: uvicorn jobhunt_core.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.core.prod
    environment:
      - CORE_ENV=prod
    # SIN puerto de host: el core se expone SOLO en la red interna (plan §21);
    # los BFF lo alcanzan como http://core-api:8000/v1. Nunca por ngrok.
    depends_on:
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    networks:
      - swissjob-net
      - core-net

  core-worker:
    image: swissjob-core:prod
    container_name: swissjob-core-worker
    restart: unless-stopped
    # SOLO colas core.* — el worker legacy escucha default/scraping/ai en OTRO broker.
    # Beat EMBEBIDO (-B, B-05, alineado con dev): cadencias de la sombra cada
    # 5 min + run_cycle 06:05 rearrancan con cada recreate. `-s /tmp/...`:
    # el proceso corre como usuario `core` y /app es de root.
    command: celery -A jobhunt_core.celery_app worker -l info -Q core.default,core.harvest,core.embedding,core.matching,core.notifications --concurrency=2 -B -s /tmp/celerybeat-schedule
    env_file:
      - .env.core.prod
    environment:
      - CORE_ENV=prod
    volumes:
      # Caché HF persistente del core (HF_HOME=/tmp/hf-cache en la imagen):
      # evita re-descargar el modelo embedding (~120 MB) en cada recreate.
      - core_hf_cache:/tmp/hf-cache
    depends_on:
      redis-core:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    networks:
      - swissjob-net
      - core-net

  core-capture:
    # Consumidor CDC de la sombra (B-01): slot lógico `jobhunt_shadow` +
    # wal2json v2. Replica con el rol jobhunt_capture (CAPTURE_DSN — SOLO en
    # .env.core.capture.prod) y escribe SOLO en jobhunt.shadow_change_log/
    # shadow_capture_state como jobhunt_core; ack al slot SIEMPRE tras el
    # commit (RPO=0, §2). No necesita redis-core.
    image: swissjob-core:prod
    container_name: swissjob-core-capture
    restart: unless-stopped
    command: python -m jobhunt_core.shadow.capture
    env_file:
      - .env.core.prod
      - .env.core.capture.prod
    environment:
      - CORE_ENV=prod
    healthcheck:
      # --health: conexión core OK + slot presente y ACTIVO + heartbeat < 26h.
      # start_period generoso: el bootstrap hace el backfill COMPLETO del
      # corpus real antes de START_REPLICATION (slot aún INACTIVO legítimo).
      test: ["CMD", "python", "-m", "jobhunt_core.shadow.capture", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    networks:
      - swissjob-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: swissjob-frontend:prod
    container_name: swissjob-frontend
    restart: unless-stopped
    ports:
      # Puerto 4000 en el host del NAS — los 8080 y 8090 están ocupados por
      # paneles internos de QTS. Si lo cambias, actualiza también
      # BACKEND_CORS_ORIGINS en .env.prod.
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - swissjob-net

networks:
  swissjob-net:
    driver: bridge
  # Red EXCLUSIVA del core: el legacy no está en ella → no alcanza redis-core.
  core-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  hfcache:
    driver: local
  redis_core_data:
    driver: local
  core_hf_cache:
    driver: local
