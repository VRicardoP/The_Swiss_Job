name: CI

on:
  # TODA rama, no solo main: el trabajo del core, el traspaso de la cosecha y el
  # punto 5 se hicieron en `feat/fase-a-core` y acumularon 626 commits SIN que el
  # CI corriera una sola vez (auditoría 2026-09-23, A19-03).
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Version FIJADA: con `pip install ruff` a secas, una release nueva del
      # linter pone el CI en rojo sin que cambie una linea de codigo. Subirla es
      # una decision, no un accidente.
      - run: pip install ruff==0.15.14
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: swissjob
          POSTGRES_PASSWORD: swissjob_dev_2024
          POSTGRES_DB: swissjobhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swissjob -d swissjobhunter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://swissjob:swissjob_dev_2024@localhost:5432/swissjobhunter
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable pgvector extension
        run: >-
          PGPASSWORD=swissjob_dev_2024
          psql -h localhost -U swissjob -d swissjobhunter
          -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: pip install -r requirements.txt
      - run: pytest

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Sin `--passWithNoTests`: si la coleccion se rompe o los ficheros se
      # mueven, el job pasaba en verde sin ejecutar nada.
      - run: npx vitest run

  core-lint:
    # INFORMATIVO por ahora: `jobhunt_core/` nunca se ha pasado por ruff y
    # acumula ~358 avisos. Se deja visible y sin bloquear hasta decidir que
    # reglas se adoptan (paquete T13); ponerlo bloqueante hoy solo enseñaria a
    # ignorar el CI.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.14
      - run: ruff check jobhunt_core --statistics

  compose-config:
    # Los composes de despliegue (prod/qnap/prebuilt/rehearsal) no se validaban
    # NUNCA: solo se construia el compose base. Un YAML roto ahi se descubria en
    # el NAS. `config -q` resuelve el modelo completo sin levantar nada.
    runs-on: ubuntu-latest
    # C7: el compose base ya no trae contrasenas por defecto — `${VAR:?}` falla
    # si faltan, que es justo lo que se quiere fuera de CI. Aqui valen valores
    # de relleno: `config -q` resuelve el modelo, no levanta nada.
    env:
      POSTGRES_PASSWORD: ci-validation-only
      REDIS_PASSWORD: ci-validation-only
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Ficheros de entorno desde sus plantillas
        run: |
          for e in .env.prod .env.core.prod .env.core.redis.prod \
                   .env.core.capture.prod .env.core.admin.prod; do
            [ -f "$e.example" ] && cp "$e.example" "$e"
          done
      - name: Validar cada compose
        run: |
          set -e
          # `dev` es un OVERRIDE: por si solo no declara imagen para core-capture
          # y `config` falla. Se valida combinado con la base, que es como se usa.
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          for f in docker-compose.prod.yml docker-compose.prebuilt.yml \
                   docker-compose.core-local.yml; do
            echo "== $f"
            docker compose -f "$f" config -q
          done
          # `qnap` y `rehearsal.qnap` NO se validan aqui: sus `env_file` son rutas
          # ABSOLUTAS del NAS (/share/Public/...) que no pueden existir en CI.
          # Verificado, no supuesto: fallan con "env file ... not found".
      - name: C7 — el compose base no se reabre a la LAN
        # Un `ports:` sin interfaz vuelve a publicar postgres y redis en 0.0.0.0,
        # y un `${VAR:-clave}` devuelve una contrasena conocida a quien no
        # rellene el .env. Ninguna de las dos cosas se ve revisando un diff.
        run: python3 scripts/check_compose_exposure.py docker-compose.yml

  docker-build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-validation-only
      REDIS_PASSWORD: ci-validation-only
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
