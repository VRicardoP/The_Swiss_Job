services:
  postgres:
    # B-01 (CDC sombra): imagen custom pgvector+wal2json y wal_level=logical
    # (cambio CONFIRMADO por el propietario 2026-07-24, con ventana de
    # reinicio — wal_level no es recargable).
    build:
      context: ./docker/postgres-core
    image: swissjob-postgres-core:pg16
    container_name: swissjob-postgres
    command: -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swissjob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swissjob_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-swissjobhunter}
    ports:
      - "${HOST_POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swissjob} -d ${POSTGRES_DB:-swissjobhunter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swissjob-redis
    ports:
      - "${HOST_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swissjob-backend
    ports:
      - "${HOST_BACKEND_PORT:-8002}:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swissjob-worker
    command: celery -A celery_app worker -l info -Q default,scraping --concurrency=4 -P prefork
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-ai:
    # Worker DEDICADO a la cola "ai": carga el modelo de embeddings UNA vez
    # (concurrency=1). El worker general ya no escucha "ai" (PF.4).
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swissjob-worker-ai
    command: celery -A celery_app worker -l info -Q ai --concurrency=1 -P prefork
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      # Sin reciclado del hijo prefork → NO recarga el modelo de embeddings (rev.3 #2).
      - CELERY_MAX_TASKS_PER_CHILD=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- jobhunt-core (Fase A, A-01) — aislado del legacy (ADR-08 / plan §15bis) ----

  redis-core:
    # Broker/locks DEDICADOS del core: noeviction (un broker jamás expulsa
    # mensajes ni locks) + AOF (persistencia: recrear el contenedor no pierde
    # tareas) + auth + red propia core-net (el legacy NO lo alcanza) + puerto
    # host solo en localhost. La caché legacy sigue en `redis`.
    image: redis:7-alpine
    container_name: swissjob-redis-core
    environment:
      - CORE_REDIS_PASSWORD=${CORE_REDIS_PASSWORD:-core_redis_dev}
    command:
      - sh
      - -c
      - >-
        redis-server --maxmemory 256mb --maxmemory-policy noeviction
        --appendonly yes --appendfsync everysec
        --requirepass "$$CORE_REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${HOST_REDIS_CORE_PORT:-6381}:6379"
    volumes:
      - redis_core_data:/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CORE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-migrate:
    # Job de migración PROPIO del core (one-shot): bootstrap de rol+esquema
    # (idempotente, con credencial admin) + alembic upgrade head. Las
    # migraciones legacy son MANUALES (docker compose exec backend alembic
    # upgrade head); el core NUNCA se cuelga de eso — core-capture espera el
    # esquema legacy con backoff antes de crear su slot (B-01).
    build:
      context: .
      dockerfile: jobhunt_core/Dockerfile
    image: swissjob-core:dev
    container_name: swissjob-core-migrate
    command: python -m jobhunt_core.migrate
    environment:
      - CORE_DATABASE_URL=postgresql+asyncpg://jobhunt_core:${CORE_DB_PASSWORD:-jobhunt_core_dev}@postgres:5432/${POSTGRES_DB:-swissjobhunter}
      - CORE_ADMIN_DATABASE_URL=postgresql://${POSTGRES_USER:-swissjob}:${POSTGRES_PASSWORD:-swissjob_dev_2024}@postgres:5432/${POSTGRES_DB:-swissjobhunter}
      - CORE_DB_PASSWORD=${CORE_DB_PASSWORD:-jobhunt_core_dev}
      # Espejo de CORE_DB_PASSWORD para el rol de captura (B-01): el bootstrap
      # crea jobhunt_capture con la MISMA credencial que usa core-capture en
      # su CAPTURE_DSN (mismo default jobhunt_capture_dev en ambos lados).
      - CORE_CAPTURE_PASSWORD=${CORE_CAPTURE_PASSWORD:-jobhunt_capture_dev}
    volumes:
      # Código vivo también en el job de migración (mismo trato que api/worker):
      # evita ejecutar una imagen desactualizada en dev.
      - ./jobhunt_core:/app/jobhunt_core
    networks:
      - default
      - core-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core-api:
    build:
      context: .
      dockerfile: jobhunt_core/Dockerfile
    image: swissjob-core:dev
    container_name: swissjob-core-api
    command: uvicorn jobhunt_core.api.main:app --host 0.0.0.0 --port 8000
    ports:
      # 8003: puerto dedicado del core (plan §21) — sin colisión con 8001/8002/5174/5435/6380.
      - "${HOST_CORE_API_PORT:-8003}:8000"
    environment:
      - CORE_DATABASE_URL=postgresql+asyncpg://jobhunt_core:${CORE_DB_PASSWORD:-jobhunt_core_dev}@postgres:5432/${POSTGRES_DB:-swissjobhunter}
      - CORE_BROKER_URL=redis://:${CORE_REDIS_PASSWORD:-core_redis_dev}@redis-core:6379/0
      - CORE_RESULT_BACKEND=redis://:${CORE_REDIS_PASSWORD:-core_redis_dev}@redis-core:6379/1
    volumes:
      - ./jobhunt_core:/app/jobhunt_core
    networks:
      - default
      - core-net
    depends_on:
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      core-migrate:
        # La API no arranca sobre una BD sin migrar (además de /v1/ready).
        condition: service_completed_successfully

  core-worker:
    build:
      context: .
      dockerfile: jobhunt_core/Dockerfile
    image: swissjob-core:dev
    container_name: swissjob-core-worker
    # SOLO colas core.* — el worker legacy escucha default/scraping/ai en OTRO broker.
    # Beat EMBEBIDO (-B) en el worker (B-05, decisión del propietario 2026-07-25):
    # el beat lanzado con `exec -d ... beat` moría EN SILENCIO con cada `up -d`
    # (recreate) y con él la única alerta de retención WAL de la BD compartida
    # (CONTRATOS_FASE_B §6/§8). Embebido, cada recreate/restart del worker
    # rearranca el beat automáticamente. `-s /tmp/...`: el proceso corre como
    # usuario `core` y /app es de root — el shelve del beat necesita ruta escribible.
    command: celery -A jobhunt_core.celery_app worker -l info -Q core.default,core.harvest,core.embedding,core.matching,core.notifications --concurrency=2 -B -s /tmp/celerybeat-schedule
    restart: unless-stopped
    environment:
      - CORE_DATABASE_URL=postgresql+asyncpg://jobhunt_core:${CORE_DB_PASSWORD:-jobhunt_core_dev}@postgres:5432/${POSTGRES_DB:-swissjobhunter}
      - CORE_BROKER_URL=redis://:${CORE_REDIS_PASSWORD:-core_redis_dev}@redis-core:6379/0
      - CORE_RESULT_BACKEND=redis://:${CORE_REDIS_PASSWORD:-core_redis_dev}@redis-core:6379/1
    volumes:
      - ./jobhunt_core:/app/jobhunt_core
    networks:
      - default
      - core-net
    depends_on:
      redis-core:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully

  core-capture:
    # Consumidor CDC de la sombra (B-01): slot lógico `jobhunt_shadow` +
    # wal2json v2. Replica con el rol jobhunt_capture (CAPTURE_DSN) y escribe
    # SOLO en jobhunt.shadow_change_log/shadow_capture_state como jobhunt_core;
    # ack al slot SIEMPRE tras el commit (pérdida imposible, §2). No necesita
    # redis-core: proceso dedicado, no worker Celery.
    build:
      context: .
      dockerfile: jobhunt_core/Dockerfile
    image: swissjob-core:dev
    container_name: swissjob-core-capture
    command: python -m jobhunt_core.shadow.capture
    restart: unless-stopped
    environment:
      - CORE_DATABASE_URL=postgresql+asyncpg://jobhunt_core:${CORE_DB_PASSWORD:-jobhunt_core_dev}@postgres:5432/${POSTGRES_DB:-swissjobhunter}
      - CAPTURE_DSN=postgresql://jobhunt_capture:${CORE_CAPTURE_PASSWORD:-jobhunt_capture_dev}@postgres:5432/${POSTGRES_DB:-swissjobhunter}
    volumes:
      - ./jobhunt_core:/app/jobhunt_core
    healthcheck:
      # Subcomando --health del propio módulo: conexión core OK + slot
      # presente y ACTIVO (walsender conectado) + updated_at de la frontera
      # con antigüedad < 26h (el legacy garantiza tráfico diario).
      # start_period generoso: el bootstrap hace el backfill COMPLETO de jobs
      # antes de registrar la frontera (slot aún INACTIVO hasta
      # START_REPLICATION — inactivo legítimo que cubre este start_period).
      test: ["CMD", "python", "-m", "jobhunt_core.shadow.capture", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swissjob-frontend
    ports:
      - "${HOST_FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  redis_core_data:

networks:
  # Red EXCLUSIVA del core: el legacy no está en ella → no puede alcanzar
  # redis-core (ni leer/escribir/FLUSHALL su broker). Los servicios core están
  # también en `default` para llegar a postgres.
  core-net:
