    # --- A-25: cabeceras de seguridad -------------------------------------
    #
    # No había NINGUNA: ni nosniff, ni frame-ancestors, ni Referrer-Policy, ni
    # CSP. Importa porque el frontend inyecta HTML con `dangerouslySetInnerHTML`
    # en dos sitios —descripciones de oferta y salida del LLM— y
    # `utils/sanitizeHtml.js` (DOMPurify con allowlist) era la ÚNICA capa: un
    # fallo suyo o una regresión en la allowlist no tenía red debajo. Y el JWT
    # vive en `localStorage`, alcanzable desde cualquier JS del origen.
    #
    # OJO AL `always` Y A LA HERENCIA: `add_header` NO se hereda en un bloque
    # que tenga su propio `add_header`, y aquí los tres `location` tienen uno
    # (Cache-Control, Content-Type). Por eso van en un fichero incluido desde
    # CADA bloque en vez de una sola vez en el `server` — ponerlas arriba las
    # habría dejado fuera de las tres rutas que de verdad sirven contenido.
    #
    # HSTS no se pone a propósito: el despliegue es HTTP sobre Tailscale, que ya
    # cifra, y un `Strict-Transport-Security` sin TLS rompería el acceso.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # `frame-ancestors` en vez de X-Frame-Options: lo entienden los navegadores
    # vigentes y permite decir 'none' sin ambigüedad.
    # `connect-src 'self'` basta porque la API se alcanza por ruta relativa
    # (`/api/v1`), vía este mismo proxy. Las fuentes de Google están
    # contempladas porque `index.html` las carga.
    # `worker-src`/`child-src` con `blob:` por la generación de PDF: el botón de
    # descarga usa html2pdf (html2canvas + jsPDF), que trabaja con blobs. Se
    # comprobó que la app llama a `.save()` —descarga directa— y NO a la rama
    # `pdfobjectnewwindow` de jsPDF, que es la única que pediría un script a
    # cdnjs.cloudflare.com; por eso el CDN no aparece en `script-src`. Si algún
    # día se usa esa rama, habrá que decidirlo, no añadirlo por si acaso.
    #
    # `'unsafe-inline'` en `style-src` es inevitable: Tailwind y React inyectan
    # estilos en línea. No se pone en `script-src`, que es donde importa.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'" always;
