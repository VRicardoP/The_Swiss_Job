# SwissJobHunter — versión específica para Container Station QNAP.
# Self-contained: rutas absolutas para volúmenes y env_file.
# Container Station NO expande ${VARS} ni resuelve env_file relativo, por eso
# todos los paths van absolutos: /share/Public/swissjob/...
# Todos los servicios que necesitan credenciales (postgres, backend, worker)
# leen del mismo .env.prod → imposible que se desincronicen.

services:
  postgres:
    # B-01 (sombra en PRODUCCIÓN — autorización del propietario 2026-07-28):
    # imagen custom pgvector+wal2json. Container Station NO construye: cargar
    # antes por tar (docker load -i swissjob-postgres-core.tar) o registry
    # local — ver jobhunt_core/shadow/DEPLOY_NAS.md. wal_level=logical va por
    # command y NO es recargable: aplicar este YAML exige REINICIO del
    # Postgres COMPARTIDO con el legacy (ventana de mantenimiento).
    image: swissjob-postgres-core:pg16
    container_name: swissjob-postgres
    restart: unless-stopped
    command: -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    # env_file con path absoluto (Container Station QNAP no resuelve paths
    # relativos). Misma fuente de credenciales que backend y worker:
    # imposible que postgres y backend usen passwords distintos.
    env_file:
      - /share/Public/swissjob/.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /share/Public/swissjob/docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      # $$ escapa la sustitución de compose; el shell del contenedor resuelve
      # $POSTGRES_USER / $POSTGRES_DB con su propio entorno (cargado vía env_file).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swissjob-net

  redis:
    image: redis:7-alpine
    container_name: swissjob-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swissjob-net

  backend:
    image: swissjob-backend:prod
    container_name: swissjob-backend
    restart: unless-stopped
    env_file:
      - /share/Public/swissjob/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Cache de HuggingFace persistente — evita re-descargar el modelo
      # paraphrase-multilingual-MiniLM-L12-v2 (~120 MB) en cada Recreate.
      - hfcache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      # start_period generoso: el primer arranque carga el modelo embedding
      # (~120 MB) en CPU del NAS, ~4-5 min. Después del primer arranque el
      # modelo queda en el volumen hfcache y el siguiente Recreate es <60s.
      start_period: 360s
      retries: 5
    networks:
      - swissjob-net

  worker:
    # Worker ÚNICO: consume default + scraping + ai. Alineado con lo REALMENTE
    # desplegado en el NAS (verificado 2026-08-06); la separación worker/worker-ai
    # del repo nunca llegó a desplegarse y su imagen swissjob-worker:prod no existe
    # ni en el NAS ni en dev → un `up` con ella daba "pull access denied".
    #
    # ⚠ ACOPLE: este servicio ejecuta los scrapers Playwright, así que
    # swissjob-backend:prod DEBE construirse CON Chromium (INSTALL_BROWSERS=true).
    # La imagen cargada hoy en el NAS lo lleva (/ms-playwright/chromium-1228,
    # verificado lanzando Chromium 149). Pero docker-compose.prod.yml:84 construye
    # el backend con INSTALL_BROWSERS=false: si se rebuildea el backend desde ahí y
    # se carga en el NAS, el worker pierde Chromium y TODO scraper Playwright
    # (jobs.admin.ch, medjobs...) falla. Rebuild del backend ⇒ INSTALL_BROWSERS=true,
    # o restaurar la separación worker/worker-ai construyendo swissjob-worker:prod.
    #
    # ⚠ DEUDA PF.4: con concurrency=2 sobre la cola "ai" pueden coexistir 2 copias
    # del modelo de embeddings (~400MB c/u). La separación worker-ai existía para
    # dejarlo en 1 sola carga. Al alinear con lo desplegado, esa mejora queda fuera.
    image: swissjob-backend:prod
    container_name: swissjob-worker
    restart: unless-stopped
    env_file:
      - /share/Public/swissjob/.env.prod
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - hfcache:/home/app/.cache/huggingface
    entrypoint: []
    command:
      - celery
      - -A
      - celery_app
      - worker
      - -Q
      - default,scraping,ai
      - --concurrency=2
      - --loglevel=info
    networks:
      - swissjob-net

  # ---- jobhunt-core — SOMBRA EN PRODUCCIÓN (Fase B, autorización del
  # propietario 2026-07-28: el equipo local no está 24h; contrato §0 "cero
  # efectos visibles a usuarios" SIGUE VIGENTE — el outbox solo entrega al
  # inbox sombra jobhunt.shadow_inbox).
  # SIN `profiles:`: Container Station ejecuta `up -d` sin --profile, así que
  # un servicio con profile jamás arrancaría — el core arranca con la app.
  # Imagen swissjob-core:prod cargada por tar (como worker).
  # AISLAMIENTO de secretos (revisión A-01 #1): el core NO recibe el .env.prod
  # legacy. Runtime → /share/Public/swissjob/.env.core.prod; credencial admin
  # (+ CORE_CAPTURE_PASSWORD, B-01) → SOLO core-migrate vía
  # /share/Public/swissjob/.env.core.admin.prod; DSN de REPLICACIÓN
  # (CAPTURE_DSN) → SOLO core-capture vía /share/Public/swissjob/.env.core.capture.prod.

  redis-core:
    image: redis:7-alpine
    container_name: swissjob-redis-core
    restart: unless-stopped
    # noeviction (broker jamás expulsa mensajes/locks, ADR-08) + AOF + auth +
    # red core-net exclusiva (el legacy no lo alcanza).
    # SOLO recibe su propio secreto (rev. #2): nunca URLs de BD/Celery.
    env_file:
      - /share/Public/swissjob/.env.core.redis.prod
    command:
      - sh
      - -c
      - >-
        redis-server --maxmemory 256mb --maxmemory-policy noeviction
        --appendonly yes --appendfsync everysec
        --requirepass "$$CORE_REDIS_PASSWORD"
    volumes:
      - redis_core_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CORE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - core-net

  core-migrate:
    # Container Station NO construye: la imagen llega por `docker load`. El SHA de la
    # release va HORNEADO en ella, así que hay que construirla con el build arg
    # (auditoría G9 P2-B) antes de exportarla:
    #   RELEASE_SHA=$(git rev-parse --short HEAD) \
    #     docker compose -f docker-compose.prod.yml build core-migrate
    #   docker save swissjob-core:prod | gzip > swissjob-core.tar.gz
    # Sin él la imagen hornea `unknown`, las sondas responden `authoritative: false`
    # y la verificación «todos publican el mismo SHA» no dice nada.
    image: swissjob-core:prod
    container_name: swissjob-core-migrate
    command: python -m jobhunt_core.migrate
    env_file:
      - /share/Public/swissjob/.env.core.prod
      - /share/Public/swissjob/.env.core.admin.prod
    environment:
      - CORE_ENV=prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - swissjob-net
      - core-net

  core-api:
    image: swissjob-core:prod
    container_name: swissjob-core-api
    restart: unless-stopped
    command: uvicorn jobhunt_core.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - /share/Public/swissjob/.env.core.prod
    environment:
      - CORE_ENV=prod
    # SIN puerto de host: solo red interna (plan §21); nunca por ngrok.
    healthcheck:
      # /v1/ready, no un health estático: la BD responde Y su head de Alembic es el que
      # espera el código DE ESTA IMAGEN. Sin esta sonda la API estuvo dos días en 503
      # sin que nadie se enterara (auditoría externa P1-3). Sin ${VARS}: Container
      # Station no los expande.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    networks:
      - swissjob-net
      - core-net

  core-worker:
    image: swissjob-core:prod
    container_name: swissjob-core-worker
    restart: unless-stopped
    # SOLO colas core.* — el worker legacy escucha default/scraping/ai en OTRO broker.
    # Beat EMBEBIDO (-B, B-05, alineado con dev): las cadencias de la sombra
    # (proyección/salud del slot/muestreo outbox/despacho cada 5 min +
    # run_cycle 06:05 Europe/Zurich) rearrancan con cada Recreate — un beat
    # aparte moría EN SILENCIO y apagaba la alerta de retención WAL (§6/§8).
    # `-s /tmp/...`: el proceso corre como usuario `core` y /app es de root.
    command: celery -A jobhunt_core.celery_app worker -l info -Q core.default,core.harvest,core.embedding,core.matching,core.notifications --concurrency=2 -B -s /tmp/celerybeat-schedule
    env_file:
      - /share/Public/swissjob/.env.core.prod
    environment:
      - CORE_ENV=prod
    volumes:
      # Caché HF persistente del core (la imagen fija HF_HOME=/tmp/hf-cache):
      # sin volumen, cada Recreate re-descarga el modelo embedding (~120 MB)
      # en la CPU del NAS — misma lección que la incidencia #6 del legacy.
      - core_hf_cache:/tmp/hf-cache
    depends_on:
      redis-core:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    networks:
      - swissjob-net
      - core-net

  core-capture:
    # Consumidor CDC de la sombra (B-01): slot lógico `jobhunt_shadow` +
    # wal2json v2 sobre el Postgres COMPARTIDO. Replica con el rol
    # jobhunt_capture (CAPTURE_DSN — SOLO en .env.core.capture.prod: el
    # privilegio REPLICATION lee TODO el WAL del clúster) y escribe SOLO en
    # jobhunt.shadow_change_log/shadow_capture_state como jobhunt_core; ack
    # al slot SIEMPRE tras el commit (RPO=0, §2). No necesita redis-core:
    # proceso dedicado, no worker Celery.
    image: swissjob-core:prod
    container_name: swissjob-core-capture
    restart: unless-stopped
    command: python -m jobhunt_core.shadow.capture
    env_file:
      - /share/Public/swissjob/.env.core.prod
      - /share/Public/swissjob/.env.core.capture.prod
    environment:
      - CORE_ENV=prod
    healthcheck:
      # Subcomando --health del propio módulo: conexión core OK + slot
      # presente y ACTIVO (walsender conectado) + heartbeat < 26h.
      # start_period MÁS generoso que en dev (600s vs 300s): el bootstrap
      # hace el backfill COMPLETO del corpus REAL en la CPU del NAS antes de
      # START_REPLICATION (slot aún INACTIVO — inactivo legítimo cubierto).
      # timeout 60s (dev: 10s) e interval 120s (dev: 60s): MEDIDO en el NAS el
      # 2026-08-06 — el subcomando tarda ~32s (arranque de Python + imports del
      # paquete core con el NAS a load ~18). Con 10s daba `unhealthy` permanente
      # con el CDC perfectamente sano (heartbeat de 0,05s, slot activo, streaming).
      # El interval no debe ser menor que lo que tarda el propio comando.
      test: ["CMD", "python", "-m", "jobhunt_core.shadow.capture", "--health"]
      interval: 120s
      timeout: 60s
      retries: 3
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    networks:
      - swissjob-net

  frontend:
    image: swissjob-frontend:prod
    container_name: swissjob-frontend
    restart: unless-stopped
    ports:
      # Puerto 4000 en el host del NAS — los 8080 y 8090 están ocupados por
      # paneles internos de QTS. Si lo cambias, actualiza también
      # BACKEND_CORS_ORIGINS en .env.prod.
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, NO localhost: dentro del contenedor `localhost` resuelve primero
      # a ::1 y nginx solo escucha en IPv4 (el 10-listen-on-ipv6-by-default.sh no
      # toca default.conf porque difiere del empaquetado) → "connection refused" y
      # `unhealthy` PERMANENTE con nginx sirviendo perfectamente. Diagnosticado el
      # 2026-08-06: 16.351 fallos seguidos mientras :4000 devolvía HTTP 200.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - swissjob-net

networks:
  swissjob-net:
    driver: bridge
  # Red EXCLUSIVA del core: el legacy no está en ella → no alcanza redis-core.
  core-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  hfcache:
    driver: local
  redis_core_data:
    driver: local
  core_hf_cache:
    driver: local
