# SwissJobHunter — versión específica para Container Station QNAP.
# Self-contained: rutas absolutas para volúmenes y env_file.
# Container Station NO expande ${VARS} ni resuelve env_file relativo, por eso
# todos los paths van absolutos: /share/Public/swissjob/...
# Todos los servicios que necesitan credenciales (postgres, backend, worker)
# leen del mismo .env.prod → imposible que se desincronicen.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: swissjob-postgres
    restart: unless-stopped
    # env_file con path absoluto (Container Station QNAP no resuelve paths
    # relativos). Misma fuente de credenciales que backend y worker:
    # imposible que postgres y backend usen passwords distintos.
    env_file:
      - /share/Public/swissjob/.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /share/Public/swissjob/docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      # $$ escapa la sustitución de compose; el shell del contenedor resuelve
      # $POSTGRES_USER / $POSTGRES_DB con su propio entorno (cargado vía env_file).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swissjob-net

  redis:
    image: redis:7-alpine
    container_name: swissjob-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swissjob-net

  backend:
    image: swissjob-backend:prod
    container_name: swissjob-backend
    restart: unless-stopped
    env_file:
      - /share/Public/swissjob/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Cache de HuggingFace persistente — evita re-descargar el modelo
      # paraphrase-multilingual-MiniLM-L12-v2 (~120 MB) en cada Recreate.
      - hfcache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      # start_period generoso: el primer arranque carga el modelo embedding
      # (~120 MB) en CPU del NAS, ~4-5 min. Después del primer arranque el
      # modelo queda en el volumen hfcache y el siguiente Recreate es <60s.
      start_period: 360s
      retries: 5
    networks:
      - swissjob-net

  worker:
    # Imagen CON Chromium: el worker ejecuta los scrapers Playwright. NO puede
    # usar swissjob-backend:prod, que se construye esbelta (INSTALL_BROWSERS=false).
    # Container Station no construye: carga swissjob-worker:prod (build en dev con
    # docker-compose.prod.yml → docker save → docker load en el NAS).
    image: swissjob-worker:prod
    container_name: swissjob-worker
    restart: unless-stopped
    env_file:
      - /share/Public/swissjob/.env.prod
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: []
    command:
      - celery
      - -A
      - celery_app
      - worker
      - -Q
      - default,scraping
      - --concurrency=2
      - --loglevel=info
    networks:
      - swissjob-net

  worker-ai:
    # Worker DEDICADO a la cola "ai": carga el modelo de embeddings UNA sola vez
    # (concurrency=1). El worker general ya no escucha "ai", así que
    # no lo carga → 1 copia del modelo (~400MB) en vez de hasta 3 (PF.4).
    image: swissjob-worker:prod
    container_name: swissjob-worker-ai
    restart: unless-stopped
    env_file:
      - /share/Public/swissjob/.env.prod
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - hfcache:/home/app/.cache/huggingface
    environment:
      # Sin reciclado del hijo prefork → NO recarga el modelo de embeddings (rev.3 #2).
      - CELERY_MAX_TASKS_PER_CHILD=0
    entrypoint: []
    command:
      - celery
      - -A
      - celery_app
      - worker
      - -Q
      - ai
      - --concurrency=1
      - --loglevel=info
    networks:
      - swissjob-net

  # ---- jobhunt-core (Fase A, A-01) — perfil "core": NO arranca hasta Fase B
  # (sombra). Activar con: docker compose --profile core up -d
  # Imagen swissjob-core:prod cargada por tar (como worker).
  # AISLAMIENTO de secretos (revisión A-01 #1): el core NO recibe el .env.prod
  # legacy. Runtime → /share/Public/swissjob/.env.core.prod; credencial admin →
  # SOLO core-migrate vía /share/Public/swissjob/.env.core.admin.prod.

  redis-core:
    profiles: ["core"]
    image: redis:7-alpine
    container_name: swissjob-redis-core
    restart: unless-stopped
    # noeviction (broker jamás expulsa mensajes/locks, ADR-08) + AOF + auth +
    # red core-net exclusiva (el legacy no lo alcanza).
    # SOLO recibe su propio secreto (rev. #2): nunca URLs de BD/Celery.
    env_file:
      - /share/Public/swissjob/.env.core.redis.prod
    command:
      - sh
      - -c
      - >-
        redis-server --maxmemory 256mb --maxmemory-policy noeviction
        --appendonly yes --appendfsync everysec
        --requirepass "$$CORE_REDIS_PASSWORD"
    volumes:
      - redis_core_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CORE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - core-net

  core-migrate:
    profiles: ["core"]
    image: swissjob-core:prod
    container_name: swissjob-core-migrate
    command: python -m jobhunt_core.migrate
    env_file:
      - /share/Public/swissjob/.env.core.prod
      - /share/Public/swissjob/.env.core.admin.prod
    environment:
      - CORE_ENV=prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - swissjob-net
      - core-net

  core-api:
    profiles: ["core"]
    image: swissjob-core:prod
    container_name: swissjob-core-api
    restart: unless-stopped
    command: uvicorn jobhunt_core.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - /share/Public/swissjob/.env.core.prod
    environment:
      - CORE_ENV=prod
    # SIN puerto de host: solo red interna (plan §21); nunca por ngrok.
    depends_on:
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    networks:
      - swissjob-net
      - core-net

  core-worker:
    profiles: ["core"]
    image: swissjob-core:prod
    container_name: swissjob-core-worker
    restart: unless-stopped
    # SOLO colas core.* — el worker legacy escucha default/scraping/ai en OTRO broker.
    command: celery -A jobhunt_core.celery_app worker -l info -Q core.default,core.harvest,core.embedding,core.matching,core.notifications --concurrency=2
    env_file:
      - /share/Public/swissjob/.env.core.prod
    environment:
      - CORE_ENV=prod
    depends_on:
      redis-core:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    networks:
      - swissjob-net
      - core-net

  frontend:
    image: swissjob-frontend:prod
    container_name: swissjob-frontend
    restart: unless-stopped
    ports:
      # Puerto 4000 en el host del NAS — los 8080 y 8090 están ocupados por
      # paneles internos de QTS. Si lo cambias, actualiza también
      # BACKEND_CORS_ORIGINS en .env.prod.
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - swissjob-net

networks:
  swissjob-net:
    driver: bridge
  # Red EXCLUSIVA del core: el legacy no está en ella → no alcanza redis-core.
  core-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  hfcache:
    driver: local
  redis_core_data:
    driver: local
